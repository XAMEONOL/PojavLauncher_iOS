name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build (iOS)
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Install Build Dependencies (gmake, cmake, ldid)
        run: |
          brew install make cmake ldid
          sudo ln -s /opt/homebrew/bin/gmake /usr/local/bin/gmake || sudo ln -s /usr/bin/make /usr/local/bin/gmake || true

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        id: setup-java8
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Register JDK 8 in macOS system
        run: |
          JAVA_PATH="${{ steps.setup-java8.outputs.path }}"
          sudo mkdir -p /Library/Java/JavaVirtualMachines
          sudo ln -sf "$JAVA_PATH/../.." /Library/Java/JavaVirtualMachines/zulu-8.jdk
          /usr/libexec/java_home -v 1.8 || true

      - name: Download JRE Runtimes
        run: |
          mkdir -p depends
          curl -L -o depends/jre8-ios-aarch64.tar.xz https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-b272/jre8-ios-aarch64.tar.xz || true
          curl -L -o depends/jre17-ios-aarch64.tar.xz https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-20230514/jre17-ios-aarch64.tar.xz || true
          curl -L -o depends/jre21-ios-aarch64.tar.xz https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-20231019/jre21-ios-aarch64.tar.xz || true

      - name: Build for iOS
        run: |
          export JAVA_HOME="${{ steps.setup-java8.outputs.path }}"
          export PATH="$JAVA_HOME/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUNNER=1 SLIMMED=1
          
          sed -i '' 's/$(error You need to install JDK 8)/$(info JDK 8 check bypassed)/g' Makefile

          gmake -j$(sysctl -n hw.ncpu) dsym package \
            PLATFORM=${{ matrix.platform }} \
            BOOTJDK="$JAVA_HOME" \
            JAVA_HOME="$JAVA_HOME"

          gmake -j$(sysctl -n hw.ncpu) dsym package \
            PLATFORM=${{ matrix.platform }} \
            TROLLSTORE_JIT_ENT=1 \
            BOOTJDK="$JAVA_HOME" \
            JAVA_HOME="$JAVA_HOME"

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher-${{ matrix.platform_name }}.ipa
          path: artifacts/net.kdt.pojavlauncher-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: net.kdt.pojavlauncher.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/net.kdt.pojavlauncher.slimmed-*-${{ matrix.platform_name }}.ipa
